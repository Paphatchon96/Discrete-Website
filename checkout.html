<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Checkout — SETCORE</title><link rel="stylesheet" href="style.css"/></head>
<body>
<!-- BOOKMARK: BOOLEAN LOGIC — checkout state and empty-cart handling are implemented in script.js; the concept is hidden from the storefront. -->
<header class="site"><div class="wrap site-header-inner"><a class="logo" href="index.html" aria-label="SETCORE home"><svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="10" y="10" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 16 H4 M10 24 H4 M30 16 H36 M30 24 H36 M16 10 V4 M24 10 V4 M16 30 V36 M24 30 V36" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="3.5" fill="#f2a93b"/></svg><span class="logo-text"><span class="brace">{</span>SETCORE<span class="brace">}</span></span></a><nav class="main-nav"><a href="index.html">Home</a><a href="products.html">Catalog</a><a href="checkout.html" class="active">Checkout</a></nav><a class="cart-pill" href="checkout.html">Cart <span class="count" data-cart-count>0</span></a></div></header>
<main><section class="section checkout-section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Your order</div><h2>Cart &amp; checkout</h2></div><span class="tag mono">Review before placing your order</span></div><div class="cart-layout"><section><div class="cart-lines" id="cart-root"></div></section><aside class="cart-summary" id="cart-summary"><h3>Order summary</h3><div class="summary-row"><span>Subtotal</span><span class="val" id="summary-subtotal">$0</span></div><div class="summary-row"><span>Shipping</span><span class="val" id="summary-shipping">Free</span></div>
<div class="summary-discount">
  <label for="discount-code">Discount code</label>
  <div class="summary-discount-row">
    <input id="discount-code" type="text" autocomplete="off" placeholder="Try code SET10" aria-label="Discount code" />
    <button id="apply-discount" class="btn btn-solid" type="button">Apply</button>
  </div>
  <p id="discount-message" class="discount-message" aria-live="polite"></p>
</div>
<div class="summary-row discount-row"><span>Discount</span><span class="val" id="summary-discount">—</span></div>
<div class="summary-row total"><span>Total</span><span class="val" id="summary-total">$0</span></div><button class="btn btn-solid btn-block" id="checkout-btn" type="button">Place order</button><p class="checkout-note">Free shipping automatically applies to orders of $150 or more.</p></aside></div></div></section></main>
<footer class="site"><div class="wrap footer-inner"><span>&copy; <span data-year></span> SETCORE Hardware Co.</span><span class="set-motif">Secure, simple checkout.</span></div></footer><script src="script.js"></script></body></html>
