<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Catalog — SETCORE</title><link rel="stylesheet" href="style.css"/></head>
<body>
<!-- BOOKMARK: LOGIC — catalog filtering decisions are handled by script.js; the learning concept is intentionally hidden. -->
<header class="site"><div class="wrap site-header-inner"><a class="logo" href="index.html" aria-label="SETCORE home"><svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="10" y="10" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 16 H4 M10 24 H4 M30 16 H36 M30 24 H36 M16 10 V4 M24 10 V4 M16 30 V36 M24 30 V36" stroke="currentColor" stroke-width="2"/><circle cx="20" cy="20" r="3.5" fill="#f2a93b"/></svg><span class="logo-text"><span class="brace">{</span>SETCORE<span class="brace">}</span></span></a><nav class="main-nav"><a href="index.html">Home</a><a href="products.html" class="active">Catalog</a><a href="checkout.html">Checkout</a></nav><a class="cart-pill" href="checkout.html">Cart <span class="count" data-cart-count>0</span></a></div></header>
<main><div class="catalog-layout"><aside class="filters"><div class="filters-head"><h3>Filter catalog</h3><button class="clear-btn" id="clear-filters" type="button">Clear</button></div><div class="filter-group"><h4>Category</h4><div id="category-filters"></div></div><div class="filter-group"><h4>Brand</h4><div id="brand-filters"></div></div><div class="filter-group"><h4>Maximum price</h4><input type="range" id="filter-price" min="0" step="10"/><div class="range-row"><span>$0</span><span id="filter-price-label"></span></div></div><div class="filter-group"><h4>Availability</h4><label class="filter-option"><input type="checkbox" id="filter-stock"> In stock only</label><label class="filter-option"><input type="checkbox" id="filter-sale"> On sale only</label></div></aside>
<section><div class="catalog-toolbar"><span class="result-count" id="result-count"></span><div class="sort-row"><label for="sort-select">Sort</label><select id="sort-select"><option value="featured">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option><option value="rating-desc">Rating: highest first</option></select></div></div><div class="grid" id="product-grid"></div></section></div></main>
<footer class="site"><div class="wrap footer-inner"><span>&copy; <span data-year></span> SETCORE Hardware Co.</span><span class="set-motif">Filter. Add. Checkout.</span></div></footer><script src="script.js"></script></body></html>
